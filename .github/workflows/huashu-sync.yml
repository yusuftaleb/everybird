# Weekly sync of Everybird's stickers with upstream huashu-bird-sticker. The logic lives in
# scripts/sync/huashu-sync.ts; this file only sets up, runs it, and does the remote steps (R2 upload, PR, issue).
# Setup, secrets and the R2 token's rotation: .github/workflows/README.md.
#
# R2 TOKEN EXPIRES 2027-11-06 ("everybird-huashu-sync (GitHub Action)", bucket-scoped read/write). Before then,
# mint a new bucket-scoped R2 token and update R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (and R2_ACCOUNT_ID /
# R2_BUCKET if they change), then update R2_TOKEN_EXPIRES below. From 30 days before, every run warns and opens an
# issue.
name: huashu sync

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute the diff, PR body and thumbnail sheet only (no upload, no PR, no issue)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: huashu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A quiet week takes 1-2 minutes. Rebuilding costs about 1 s of a 4-vCPU runner per sticker (sharp's WebP at
    # effort 6 is most of it), so a mass redraw of thousands of stickers can take over an hour.
    timeout-minutes: 180
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      UV_THREADPOOL_SIZE: 8 # sharp's work runs on libuv's pool (default 4); set before node starts
      R2_TOKEN_EXPIRES: '2027-11-06'
    steps:
      - uses: actions/checkout@v4

      - name: R2 token expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          days=$(( ( $(date -u -d "$R2_TOKEN_EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "R2 token expires $R2_TOKEN_EXPIRES ($days days)"
          if [ "$days" -le 30 ]; then
            echo "::warning::The R2 token for huashu sync expires on $R2_TOKEN_EXPIRES ($days days). Mint a new bucket-scoped R2 token, update the R2_* secrets and R2_TOKEN_EXPIRES (.github/workflows/README.md)."
            if [ "$DRY_RUN" != true ]; then
              title="Rotate the huashu sync R2 token (expires $R2_TOKEN_EXPIRES)"
              n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
              if [ -z "$n" ]; then
                gh issue create --title "$title" --body "The R2 API token the huashu sync uses (\"everybird-huashu-sync (GitHub Action)\") expires on $R2_TOKEN_EXPIRES. Mint a new bucket-scoped R2 read/write token, update the repo secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, and set R2_TOKEN_EXPIRES in .github/workflows/huashu-sync.yml to its new expiry. See .github/workflows/README.md."
              fi
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sync
        id: sync
        run: |
          args=(--out "$RUNNER_TEMP/huashu-sync")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          npx tsx scripts/sync/huashu-sync.ts "${args[@]}"

      - name: Summary
        if: steps.sync.outputs.changed == 'true'
        run: cat "$RUNNER_TEMP/huashu-sync/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the thumbnail sheet
        id: sheet
        if: steps.sync.outputs.sheet == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huashu-sync-sheet-${{ steps.sync.outputs.short }}
          path: ${{ runner.temp }}/huashu-sync/sheet.png
          retention-days: 30
          if-no-files-found: error

      - name: Check the R2 secrets
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          for v in R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::huashu changed ${{ steps.sync.outputs.stickers }} stickers, but these repo secrets are missing:$missing. Add them (Settings > Secrets and variables > Actions) and rerun; no PR is opened until the stickers are in R2."
            exit 1
          fi

      - name: Upload the rebuilt stickers to R2
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.sync.outputs.stickers != '0'
        env:
          STICKERS_DIR: ${{ runner.temp }}/huashu-sync/stickers
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        # STICKERS_DIR holds only the rebuilt files, under new (versioned) names: --force uploads exactly those and
        # skips listing the bucket. Nothing already published is overwritten.
        run: npx tsx scripts/deploy/upload-stickers-r2.ts --force

      - name: Commit the rebuilt stickers to everybird-stickers (GitHub Pages fallback)
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.sync.outputs.stickers != '0'
        env:
          STICKERS_REPO_TOKEN: ${{ secrets.STICKERS_REPO_TOKEN }}
          SHORT: ${{ steps.sync.outputs.short }}
        run: |
          if [ -z "$STICKERS_REPO_TOKEN" ]; then
            echo "::notice::No STICKERS_REPO_TOKEN secret: skipped committing the rebuilt stickers to yusuftaleb/everybird-stickers. GitHub Pages is only the fallback now (the app loads stickers from R2, https://stickers.yusuftaleb.com); the fallback lacks these versioned files until they are copied there."
            exit 0
          fi
          d="$RUNNER_TEMP/everybird-stickers"
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://x-access-token:${STICKERS_REPO_TOKEN}@github.com/yusuftaleb/everybird-stickers.git" "$d"
          cp -R "$RUNNER_TEMP/huashu-sync/stickers/v1" "$d/"
          cd "$d"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse v1
          if git diff --cached --quiet; then echo 'everybird-stickers already has these files'; exit 0; fi
          git commit --quiet -m "Stickers rebuilt from huashu-bird-sticker $SHORT (versioned names)"
          git push --quiet origin HEAD

      - name: Open or update the PR
        id: pr
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHEET_URL: ${{ steps.sheet.outputs.artifact-url }}
          SHORT: ${{ steps.sync.outputs.short }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          o="$RUNNER_TEMP/huashu-sync"
          day=$(date -u +%F)
          branch="huashu-sync/$day"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          xargs -a "$o/changed-files.txt" git add --
          git commit --quiet -m "data(stickers): sync huashu-bird-sticker to $SHORT"
          git push --quiet --force origin "$branch"
          sheet="${SHEET_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          sed "s|@@SHEET_URL@@|$sheet|g" "$o/pr-body.md" > "$o/pr-body.final.md"
          title="Sync huashu-bird-sticker stickers ($day)"
          n=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "$title" --body-file "$o/pr-body.final.md"
            url=$(gh pr view "$n" --json url --jq .url)
          else
            url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$o/pr-body.final.md")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # An older sync PR still open is superseded: this one carries every change since the lock on the base branch.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"huashu-sync/\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --comment "Superseded by $url, which carries every upstream change since the lock on $BASE." --delete-branch
            done

      - name: Open or update the website issue
        if: steps.sync.outputs.website == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          o="$RUNNER_TEMP/huashu-sync"
          title='Website /lifelist stickers changed upstream'
          sed "s|@@PR_URL@@|$PR_URL|g" "$o/issue-body.md" > "$o/issue-body.final.md"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$o/issue-body.final.md"
          else
            gh issue create --title "$title" --body-file "$o/issue-body.final.md"
          fi
