# Weekly sync of Everybird's stickers with upstream huashu-bird-sticker. The logic lives in
# scripts/sync/huashu-sync.ts; this file only sets up, runs it, and does the remote steps (R2 upload, PR, issues).
# Setup, secrets, the per-run cap and the R2 token's rotation: .github/workflows/README.md.
#
# R2 TOKEN EXPIRES 2027-11-06 ("everybird-huashu-sync (GitHub Action)", bucket-scoped object read/write). Before then
# create a new bucket-scoped R2 token, put its Access Key ID and Secret Access Key in the secrets R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY (R2_ACCOUNT_ID and R2_BUCKET stay as they are), and set R2_TOKEN_EXPIRES below to its expiry.
# From 30 days before, every run warns and opens an issue.
name: huashu sync

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute the diff, PR body and sheets only (no upload, no PR, no issue)'
        type: boolean
        default: false
      max_rebuild:
        description: 'Most stickers rebuilt this run (the rest wait for the next run)'
        type: number
        default: 600
      allow_big_change:
        description: 'Ship even if the diff looks like an upstream schema change (check the blocked issue first)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: huashu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # A quiet week takes 1-2 minutes. A rebuild costs about 2 s per sticker on the private-repo runner (2 vCPU; sharp's
    # WebP at effort 6 is nearly all of it), so the 600-sticker cap is about 20 minutes plus a few for setup, the
    # sheets and the upload. A bigger backlog ships 600 a week, or all at once from a laptop (README).
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      MAX_REBUILD: ${{ inputs.max_rebuild || 600 }}
      ALLOW_BIG_CHANGE: ${{ inputs.allow_big_change == true }}
      R2_TOKEN_EXPIRES: '2027-11-06'
      UV_THREADPOOL_SIZE: 4 # sharp's work runs on libuv's pool; set before node starts
    steps:
      # The run's output dir. Not beside the checkout (upload-artifact refuses a path with '..'); the runner context
      # isn't available in a job-level env, so it is set here for every later step.
      - name: Output dir
        run: echo "OUT=$RUNNER_TEMP/huashu-sync" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: R2 token expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          days=$(( ( $(date -u -d "$R2_TOKEN_EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "R2 token expires $R2_TOKEN_EXPIRES ($days days)"
          if [ "$days" -le 30 ]; then
            echo "::warning::The R2 token for huashu sync expires on $R2_TOKEN_EXPIRES ($days days). Create a new bucket-scoped R2 token, put its credentials in R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, and update R2_TOKEN_EXPIRES (.github/workflows/README.md)."
            if [ "$DRY_RUN" != true ]; then
              title="Rotate the huashu sync R2 token (expires $R2_TOKEN_EXPIRES)"
              n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
              if [ -z "$n" ]; then
                gh issue create --title "$title" --body "The R2 API token the huashu sync uses (\"everybird-huashu-sync (GitHub Action)\") expires on $R2_TOKEN_EXPIRES. In Cloudflare (R2 > Manage API tokens) create a new token with Object Read & Write on the sticker bucket only, put its Access Key ID in the secret R2_ACCESS_KEY_ID and its Secret Access Key in R2_SECRET_ACCESS_KEY (R2_ACCOUNT_ID and R2_BUCKET stay), set R2_TOKEN_EXPIRES in .github/workflows/huashu-sync.yml to the new expiry, then delete the old token. See .github/workflows/README.md."
              fi
            fi
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sync
        id: sync
        run: |
          args=(--out "$OUT" --max-rebuild "$MAX_REBUILD")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ "$ALLOW_BIG_CHANGE" = true ]; then args+=(--allow-big-change); fi
          npx tsx scripts/sync/huashu-sync.ts "${args[@]}"

      - name: Open or update the blocked-sync issue
        if: failure() && steps.sync.outputs.blocked == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='huashu sync is blocked upstream'
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "$OUT/blocked-issue.md"; else gh issue create --title "$title" --body-file "$OUT/blocked-issue.md"; fi

      - name: Upload summary.json and the before/after sheets
        id: artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: huashu-sync-${{ steps.sync.outputs.short }}
          path: ${{ runner.temp }}/huashu-sync/artifact
          retention-days: 30
          if-no-files-found: error

      - name: Fill in the artifact link
        if: steps.sync.outputs.changed == 'true'
        env:
          ARTIFACT: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          sed "s|@@ARTIFACT_URL@@|$ARTIFACT|g" "$OUT/pr-body.md" > "$OUT/pr-body.final.md"
          cat "$OUT/pr-body.final.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the R2 secrets
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          for v in R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::huashu changed ${{ steps.sync.outputs.stickers }} stickers, but these repo secrets are missing:$missing. Add them (Settings > Secrets and variables > Actions) and rerun; no PR is opened until the stickers are in R2."
            exit 1
          fi

      - name: Upload the rebuilt stickers to R2
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.sync.outputs.stickers != '0'
        env:
          STICKERS_DIR: ${{ runner.temp }}/huashu-sync/stickers
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        # STICKERS_DIR holds only the rebuilt files, under new (versioned) names. No --force: the bucket listing skips
        # what a failed earlier run already sent, and a versioned key in the bucket is never overwritten.
        run: npx tsx scripts/deploy/upload-stickers-r2.ts

      # The PR's data files under their content-hashed names (src/lib/data-files.ts), so the deploy after the merge
      # finds them on R2 (the app falls back to /data on Vercel otherwise). Hashed keys are never overwritten.
      - name: Upload the new data files to R2
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx tsx scripts/deploy/upload-stickers-r2.ts --data

      - name: Commit the rebuilt stickers to everybird-stickers (GitHub Pages fallback)
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.sync.outputs.stickers != '0'
        env:
          STICKERS_REPO_TOKEN: ${{ secrets.STICKERS_REPO_TOKEN }}
          SHORT: ${{ steps.sync.outputs.short }}
        run: |
          if [ -z "$STICKERS_REPO_TOKEN" ]; then
            echo "::notice::No STICKERS_REPO_TOKEN secret: skipped committing the rebuilt stickers to yusuftaleb/everybird-stickers. GitHub Pages is only the fallback now (the app loads stickers from R2, https://stickers.yusuftaleb.com); the fallback lacks these versioned files until they are copied there."
            exit 0
          fi
          d="$RUNNER_TEMP/everybird-stickers"
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://x-access-token:${STICKERS_REPO_TOKEN}@github.com/yusuftaleb/everybird-stickers.git" "$d"
          cp -R "$OUT/stickers/v1" "$d/"
          cd "$d"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse v1
          if git diff --cached --quiet; then echo 'everybird-stickers already has these files'; exit 0; fi
          git commit --quiet -m "Stickers rebuilt from huashu-bird-sticker $SHORT (versioned names)"
          git push --quiet origin HEAD

      - name: Open or update the PR
        id: pr
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.sync.outputs.short }}
          BASE: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          branch="huashu-sync/$day"
          # A run dispatched from another branch (a test) gets its own PR branch and leaves the default branch's alone.
          if [ "$REF" != "$BASE" ]; then branch="huashu-sync/$day-from-$(echo "$REF" | tr -c 'A-Za-z0-9._-' '-')"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          xargs -a "$OUT/changed-files.txt" git add --
          git commit --quiet -m "data(stickers): sync huashu-bird-sticker to $SHORT"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          title="Sync huashu-bird-sticker stickers ($day)"
          n=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "$title" --body-file "$OUT/pr-body.final.md"
            url=$(gh pr view "$n" --json url --jq .url)
          else
            url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$OUT/pr-body.final.md")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # An older sync PR from the default branch still open is superseded: this one carries every change since
          # the lock on it. Test runs from other branches supersede nothing.
          if [ "$REF" = "$BASE" ]; then
            gh pr list --state open --base "$BASE" --json number,headRefName \
              --jq ".[] | select(.headRefName | test(\"^huashu-sync/[0-9]{4}-[0-9]{2}-[0-9]{2}$\")) | select(.headRefName != \"$branch\") | .number" |
              while read -r old; do
                gh pr close "$old" --comment "Superseded by $url, which carries every upstream change since the lock on $BASE." --delete-branch
              done
          fi

      - name: Open or update the website issue
        if: steps.sync.outputs.website == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          title='Website /lifelist stickers changed upstream'
          sed "s|@@PR_URL@@|$PR_URL|g" "$OUT/issue-body.md" > "$OUT/issue-body.final.md"
          marker=$(head -n 1 "$OUT/issue-body.final.md")
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$title" --body-file "$OUT/issue-body.final.md"
          elif gh issue view "$n" --json body --jq .body | head -n 1 | grep -qxF "$marker"; then
            # The same published state (an unmerged sync PR, rerun or superseded): rewrite the body, no new comment.
            gh issue edit "$n" --body-file "$OUT/issue-body.final.md"
          elif gh issue view "$n" --json comments --jq '.comments[-1].body // ""' | head -n 1 | grep -qxF "$marker"; then
            # Likewise for the change the last comment lists.
            gh issue comment "$n" --edit-last --body-file "$OUT/issue-body.final.md"
          else
            # A new change since the body was written: keep the old list in the body, add this one as a comment.
            gh issue comment "$n" --body-file "$OUT/issue-body.final.md"
          fi
